name: "Build Android APK (SwingBot VN — Native FCM)"

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Validate GOOGLE_SERVICES_JSON secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GitHub Secret GOOGLE_SERVICES_JSON! Register Android app 'com.thkc.bottrader' in Firebase Console and add google-services.json as secret GOOGLE_SERVICES_JSON."
            exit 1
          fi

      - name: Install Capacitor dependencies & generate Android project
        working-directory: mobile-android
        run: |
          npm install
          npx cap add android

      - name: Inject google-services.json & configure Android 13+ Notification permission
        working-directory: mobile-android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -c '
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          txt = manifest.read_text(encoding="utf-8")
          perm = "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n"
          if "POST_NOTIFICATIONS" not in txt:
              txt = txt.replace("<application", perm + "    <application", 1)
              manifest.write_text(txt, encoding="utf-8")
          print("Manifest updated with POST_NOTIFICATIONS.")
          '
          npx cap sync android

      - name: Build Android APK (Debug — direct install)
        working-directory: mobile-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename & Upload SwingBot-VN.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwingBot-VN-APK
          path: mobile-android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
