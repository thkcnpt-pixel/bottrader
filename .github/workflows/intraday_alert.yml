name: "Tier 3: Intraday Urgent Portfolio Alerts (30m)"

on:
  schedule:
    # Phiên sáng (UTC+7): 09:15, 09:45, 10:15, 10:45 = 02:15, 02:45, 03:15, 03:45 UTC
    - cron: "15,45 2-3 * * 1-5"
    # Phiên sáng (UTC+7): 11:15 = 04:15 UTC
    - cron: "15 4 * * 1-5"
    # Phiên chiều (UTC+7): 13:15, 13:45, 14:15, 14:45 = 06:15, 06:45, 07:15, 07:45 UTC
    - cron: "15,45 6-7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: intraday-alert
  cancel-in-progress: true

jobs:
  intraday-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intraday Holding Alert Check
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VNSTOCK_PRIMARY_SOURCE: VCI
          VNSTOCK_FALLBACK_SOURCE: TCBS
          PYTHONPATH: .
        run: python scripts/intraday_alert.py
