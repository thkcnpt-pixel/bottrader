name: "Tier 2-4: Daily EOD Scan, Portfolio Check & Gemini Critique"

on:
  schedule:
    # Thứ 2 - Thứ 6 lúc 18:00 (UTC+7) = 11:00 UTC
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Swing Scan & Risk Critique
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GEMINI_FALLBACK_MODEL: gemini-2.0-flash
          VNSTOCK_PRIMARY_SOURCE: VCI
          VNSTOCK_FALLBACK_SOURCE: TCBS
          PYTHONPATH: .
        run: python scripts/daily_scan.py
