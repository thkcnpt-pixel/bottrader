name: "Tier 2-4: Daily EOD Scan, Portfolio Check & Gemini Critique"

on:
  schedule:
    # Thứ 2 - Thứ 6 lúc 18:00 (UTC+7) = 11:00 UTC
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Quét cưỡng bức kể cả ngày nghỉ lễ/cuối tuần (true/false)"
        required: false
        default: "true"

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Swing Scan & Risk Critique
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
          CKEY_API_KEY: ${{ secrets.CKEY_API_KEY }}
          CKEY_MODEL: deepseek-v4.1-flash-1017-free
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          VNSTOCK_PRIMARY_SOURCE: VCI
          VNSTOCK_FALLBACK_SOURCE: TCBS
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.force || 'true') || 'false' }}
          PYTHONPATH: .
        run: python scripts/daily_scan.py

      - name: Notify on Workflow Failure
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PYTHONPATH: .
        run: |
          python scripts/notify_workflow_failure.py \
            --workflow daily_scan \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
