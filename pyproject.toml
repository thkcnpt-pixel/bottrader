[project]
name = "vn-stock-swing-bot"
version = "1.1.0"
description = "VN Stock Swing Bot & Personal PWA (0-VND Stack)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E402"]
